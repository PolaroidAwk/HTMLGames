<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTMLGames</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* =====================================================
           CONFIGURAÇÕES
        ===================================================== */

        :root {
            --green: #39ff88;
            --green-dark: #0c7a3d;
            --green-darker: #062b18;
            --black: #020604;
        }


        /* =====================================================
           CORPO
        ===================================================== */

        body {
            background: #000;

            color: var(--green);

            font-family: "VT323", monospace;

            min-height: 100vh;

            overflow-x: hidden;
        }


        /* =====================================================
           EFEITO CRT
        ===================================================== */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 999;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.025) 0px,
                    rgba(255,255,255,0.025) 1px,
                    rgba(0,0,0,0.08) 2px,
                    rgba(0,0,0,0.08) 4px
                );

            mix-blend-mode: screen;
        }


        /* =====================================================
           VINHETA / CURVATURA
        ===================================================== */

        body::after {
            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 998;

            box-shadow:
                inset 0 0 100px rgba(0,0,0,0.95),
                inset 0 0 220px rgba(0,0,0,0.8);

            border-radius: 4%;
        }


        /* =====================================================
           MONITOR
        ===================================================== */

        .monitor {
            min-height: 100vh;

            padding: 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    ellipse at center,
                    #06170d 0%,
                    #020704 60%,
                    #000 100%
                );
        }


        /* =====================================================
           TELA
        ===================================================== */

        .screen {
            width: min(1100px, 95vw);

            min-height: 700px;

            background:
                radial-gradient(
                    ellipse at center,
                    #071d10 0%,
                    #031008 65%,
                    #010503 100%
                );

            border:

                2px solid #174f2d;

            border-radius: 25px;

            padding: 30px;

            box-shadow:

                0 0 20px rgba(57,255,136,0.15),

                0 0 70px rgba(57,255,136,0.08),

                inset 0 0 50px rgba(0,0,0,0.8);

            position: relative;

            overflow: hidden;
        }


        /* =====================================================
           BRILHO DA TELA
        ===================================================== */

        .screen::before {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(57,255,136,0.05),
                    transparent 70%
                );
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            position: relative;

            border-bottom: 1px solid var(--green-dark);

            padding-bottom: 18px;

            margin-bottom: 25px;
        }

        .header-top {
            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .system-name {
            font-size: 38px;

            text-shadow:
                0 0 5px var(--green),
                0 0 15px rgba(57,255,136,0.5);

            letter-spacing: 2px;
        }


        .status {
            font-size: 20px;

            color: var(--green);

            text-shadow:
                0 0 8px var(--green);
        }


        .status::before {
            content: "● ";

            animation: blink 1s infinite;
        }


        @keyframes blink {

            0%, 45% {
                opacity: 1;
            }

            46%, 100% {
                opacity: 0;
            }

        }


        .subtitle {
            font-size: 20px;

            color: #1ebc62;

            margin-top: 5px;
        }


        /* =====================================================
           TERMINAL
        ===================================================== */

        .terminal-line {
            font-size: 20px;

            margin-bottom: 20px;

            color: #1ebc62;
        }

        .terminal-line span {
            color: var(--green);
        }


        /* =====================================================
           ABAS (TODOS / FAVORITOS / SUGESTÕES)
        ===================================================== */

        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab {
            background: rgba(0, 20, 10, 0.4);
            border: 1px solid var(--green-dark);
            color: #168d4c;
            font-family: "VT323", monospace;
            font-size: 20px;
            padding: 5px 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .tab:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .tab.active {
            background: rgba(57, 255, 136, 0.15);
            border-color: var(--green);
            color: var(--green);
            text-shadow: 0 0 5px var(--green);
        }


        /* =====================================================
           PESQUISA
        ===================================================== */

        .search-container {
            margin-bottom: 25px;

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .prompt {
            font-size: 23px;

            color: var(--green);
        }


        .search {
            flex: 1;

            max-width: 450px;

            background: rgba(0,0,0,0.45);

            border: 1px solid var(--green-dark);

            color: var(--green);

            font-family: "VT323", monospace;

            font-size: 22px;

            padding: 7px 10px;

            outline: none;

            text-shadow:
                0 0 5px var(--green);
        }


        .search::placeholder {
            color: #176b3b;
        }


        .search:focus {
            border-color: var(--green);

            box-shadow:
                0 0 10px rgba(57,255,136,0.2);
        }


        /* =====================================================
           LISTA
        ===================================================== */

        .file-list {
            border: 1px solid var(--green-dark);

            position: relative;
        }


        /* =====================================================
           JOGO
        ===================================================== */

        .file {
            min-height: 72px;

            display: flex;

            align-items: center;

            padding: 10px 18px;

            border-bottom: 1px solid #0b4225;

            cursor: pointer;

            background: rgba(0,20,10,0.25);

            transition:
                background 0.1s,
                padding-left 0.1s;
        }


        .file:last-child {
            border-bottom: none;
        }


        .file:hover {
            background: rgba(57,255,136,0.08);

            padding-left: 27px;

            text-shadow:
                0 0 8px var(--green);
        }


        .file:hover .arrow {
            opacity: 1;
        }


        /* =====================================================
           ÍCONE
        ===================================================== */

        .icon {
            width: 50px;

            font-size: 28px;

            filter:
                grayscale(1)
                sepia(1)
                hue-rotate(70deg)
                saturate(3);

            margin-right: 10px;
        }


        /* =====================================================
           NOME E FAVORITO
        ===================================================== */

        .filename-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filename {
            font-size: 26px;

            color: var(--green);

            letter-spacing: 1px;
        }

        .fav-star {
            display: none;
            font-size: 20px;
            color: #ffd700;
            text-shadow: 0 0 5px #ffd700;
        }

        .file.favorite .fav-star {
            display: inline-block;
        }


        /* =====================================================
           DESCRIÇÃO
        ===================================================== */

        .description {
            font-size: 19px;

            color: #168d4c;

            margin-right: 25px;
        }


        /* =====================================================
           SETA
        ===================================================== */

        .arrow {
            font-size: 28px;

            color: var(--green);

            opacity: 0.4;

            transition: 0.1s;
        }


        /* =====================================================
           NENHUM JOGO
        ===================================================== */

        .empty {
            display: none;

            border: 1px solid var(--green-dark);

            border-top: none;

            padding: 40px;

            text-align: center;

            font-size: 25px;

            color: #168d4c;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            margin-top: 25px;

            display: flex;

            justify-content: space-between;

            border-top: 1px solid var(--green-dark);

            padding-top: 12px;

            color: #126b3a;

            font-size: 18px;
        }


        /* =====================================================
           CURSOR
        ===================================================== */

        .cursor {
            display: inline-block;

            width: 10px;

            height: 20px;

            background: var(--green);

            margin-left: 5px;

            animation: cursorBlink 0.8s infinite;
        }


        @keyframes cursorBlink {

            0%, 50% {
                opacity: 1;
            }

            51%, 100% {
                opacity: 0;
            }

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 700px) {

            .monitor {
                padding: 10px;
            }

            .screen {
                padding: 18px;

                min-height: 95vh;

                border-radius: 15px;
            }

            .system-name {
                font-size: 28px;
            }

            .status {
                font-size: 16px;
            }

            .description {
                display: none;
            }

            .filename {
                font-size: 23px;
            }

            .footer {
                flex-direction: column;

                gap: 5px;
            }
        }

    </style>
</head>


<body>


    <div class="monitor">

        <div class="screen">


            <header class="header">

                <div class="header-top">

                    <div class="system-name">
                        HTMLGames
                    </div>

                    <div class="status">
                        ONLINE
                    </div>

                </div>

                <div class="subtitle">
                    Polaroido - Made using AIs
                </div>

            </header>


            <div class="terminal-line">
                C:\GAMES&gt; <span>ACCESSING GAME DATABASE...</span>
            </div>

            <div class="terminal-line">
                C:\GAMES&gt; <span>SELECT A GAME TO EXECUTE (CLIQUE COM O BOTÃO DIREITO PARA FAVORITAR)</span>
            </div>


            <div class="tabs-container">
                <button class="tab active" onclick="mudarAba('todos')" id="tabTodos">TODOS OS JOGOS</button>
                <button class="tab" onclick="mudarAba('favoritos')" id="tabFavoritos">⭐ FAVORITOS</button>
                <a class="tab" href="https://forms.gle/boRAUm1VEiJNdS5DA" target="_blank">💬 SUGESTÕES</a>
            </div>


            <div class="search-container">

                <div class="prompt">
                    C:\GAMES&gt;
                </div>

                <input
                    id="search"
                    class="search"
                    type="text"
                    placeholder="SEARCH..."
                    autocomplete="off"
                >

                <span class="cursor"></span>

            </div>


            <div class="file-list" id="fileList">
                </div>


            <div
                class="empty"
                id="empty"
            >
                NO GAMES FOUND.
            </div>


            <footer class="footer">

                <div>
                    SYSTEM READY.
                </div>

                <div>
                    [ ENTER ] SELECT GAME | [ BOTÃO DIREITO ] FAVORITAR
                </div>

                <div>
                    [ ESC ] EXIT
                </div>

            </footer>


        </div>

    </div>


    <script>

        /* =====================================================
           LISTA CENTRALIZADA DE JOGOS (FÁCIL DE EDITAR)
           - id: identificador único (necessário para os favoritos)
           - nome: título principal exibido em destaque
           - desc: descrição detalhada do jogo
           - icone: emoji representativo
           - url: pode ser caminho local (ex: 'games/fnaf/index.html') ou link externo (ex: 'https://exemplo.com')
           - externo: true se for abrir em outra aba/link externo, false se for abrir localmente na mesma aba
        ===================================================== */
        const listaDeJogos = [
            {
                id: 'fnaf',
                nome: 'FNAF gemini',
                desc: "VERSÃO GEMINI",
                icone: '🐻',
                url: 'games/fnaf/index.html',
                externo: false
            },
            {
                id: 'campo-minado',
                nome: 'MINESWEEPER',
                desc: 'CAMPO-MINADO',
                icone: '💣',
                url: 'games/campo-minado/index.html',
                externo: false
            },
            {
                id: 'snake',
                nome: 'SNAKE',
                desc: 'JOGO DA COBRINHA PLUS',
                icone: '🐍',
                url: 'games/snake/index.html',
                externo: false
            },
            {
                id: 'tigrinho',
                nome: 'TIGRINHO',
                desc: 'FORTUNE TIGER',
                icone: '🎰',
                url: 'games/tigre/index.html',
                externo: false
            },
            {
                id: 'count-chaos',
                nome: 'COUNT-CHAOS',
                desc: 'CONTE DE 1 A 10 SEGUINDO AS REGRAS',
                icone: '🔢',
                url: 'games/countchaos/index.html',
                externo: false
            },
            {
                id: 'nova-terminal',
                nome: 'NOVA-TERMINAL',
                desc: 'INVISTA EM AÇÕES SEM QUEBRAR',
                icone: '📈',
                url: 'games/novaterminal/index.html',
                externo: false
            },
            {
                id: 'password',
                nome: 'THE-PASSWORD',
                desc: 'CRIE UMA SENHA ENQUANTO NOVAS DEMANDAS SÃO ADICIONADAS',
                icone: '🔑',
                url: 'games/password/index.html',
                externo: false
            },
            {
                id: 'symbol-memory',
                nome: 'SYMBOL MEMORY',
                desc: 'MEMORIZE UMA SEQUÊNCIA DE SÍMBOLOS E RESPONDA CORRETAMENTE',
                icone: '🧠',
                url: 'games/symbol/index.html',
                externo: false
            },
            {
                id: 'color-match',
                nome: 'COLOR MATCH',
                desc: 'REPLIQUE CORRETAMENTE AS CORES MOSTRADAS',
                icone: '🎨',
                url: 'games/colormatch/index.html',
                externo: false
            },
            {
                id: 'code-breaker',
                nome: 'CODE BREAKER',
                desc: 'DESVENDE O CÓDIGO SECRETO PARA INVADIR O SISTEMA',
                icone: '👨🏻‍💻',
                url: 'games/codebreaker/index.html',
                externo: false
            },
            {
                id: 'mini-market',
                nome: 'MINI MARKET',
                desc: 'GERENCIE SEU PRÓPRIO SUPER MERCADO',
                icone: '🛒',
                url: 'games/minimart/index.html',
                externo: false
            },
            {
                id: 'tboi',
                nome: 'THE BINDING OF ISAAC',
                desc: 'APENAS PARA COMPUTADORES',
                icone: '😭',
                url: 'https://patlamontagne.github.io/the-binding-of-isaac-js/',
                externo: true
            },
            {
                id: 'fnaf1',
                nome: 'FNAF 1',
                desc: "APENAS PARA COMPUTADORES",
                icone: '🐻',
                url: 'https://irv77.github.io/hd_fnaf/1/',
                externo: true
            },
            {
                id: 'fnaf2',
                nome: 'FNAF 2',
                desc: "APENAS PARA COMPUTADORES",
                icone: '🐻',
                url: 'https://irv77.github.io/hd_fnaf/2/',
                externo: true
            },
            {
                id: 'fnaf3',
                nome: 'FNAF 3',
                desc: "APENAS PARA COMPUTADORES",
                icone: '🐰',
                url: 'https://irv77.github.io/hd_fnaf/3/',
                externo: true
            },
            {
                id: 'fnaf4',
                nome: 'FNAF 4',
                desc: "APENAS PARA COMPUTADORES",
                icone: '👹',
                url: 'https://irv77.github.io/hd_fnaf/4/',
                externo: true
            }
            /* EXEMPLO DE COMO ADICIONAR UM LINK EXTERNO:
            {
                id: 'meu-jogo-externo',
                nome: 'JOGO EXTERNO',
                desc: 'JOGO HOSPEDADO EM OUTRO SITE',
                icone: '🌐',
                url: 'https://www.exemplo.com',
                externo: true
            }
            */
        ];


        /* =====================================================
           RENDERIZAR OS JOGOS NA TELA
        ===================================================== */
        const fileListContainer = document.getElementById('fileList');

        function renderizarJogos() {
            fileListContainer.innerHTML = '';
            listaDeJogos.forEach(jogo => {
                const div = document.createElement('div');
                div.className = 'file';
                div.dataset.id = jogo.id;
                div.dataset.name = `${jogo.nome} ${jogo.desc}`.toLowerCase();

                // Ação de clique: se for externo abre em nova aba, senão navega normalmente
                div.onclick = function() {
                    if (jogo.externo) {
                        window.open(jogo.url, '_blank');
                    } else {
                        window.location.href = jogo.url;
                    }
                };

                div.innerHTML = `
                    <div class="icon">${jogo.icone}</div>
                    <div class="filename-container">
                        <span class="filename">${jogo.nome}</span>
                        <span class="fav-star">⭐</span>
                    </div>
                    <div class="description">${jogo.desc}</div>
                    <div class="arrow">&gt;</div>
                `;

                fileListContainer.appendChild(div);
            });

            // Atualiza os seletores e recarrega os favoritos após renderizar
            files = document.querySelectorAll(".file");
            carregarFavoritos();
            filtrarJogos();
        }


        /* =====================================================
           ESTADO DAS ABAS E FAVORITOS
        ===================================================== */

        let abaAtual = 'todos';

        function mudarAba(aba) {
            abaAtual = aba;
            document.getElementById('tabTodos').classList.toggle('active', aba === 'todos');
            document.getElementById('tabFavoritos').classList.toggle('active', aba === 'favoritos');
            filtrarJogos();
        }


        /* =====================================================
           SISTEMA DE FAVORITOS (LOCALSTORAGE)
        ===================================================== */

        let files = [];

        function carregarFavoritos() {
            let favoritos = JSON.parse(localStorage.getItem('htmlgames_favs')) || [];
            files.forEach(file => {
                const id = file.dataset.id;
                if (favoritos.includes(id)) {
                    file.classList.add('favorite');
                } else {
                    file.classList.remove('favorite');
                }
            });
        }

        // Delegação de evento ou atribuição direta após renderizar para o botão direito (favoritar)
        function configurarEventosFavorito() {
            files.forEach(file => {
                file.addEventListener('contextmenu', function (e) {
                    e.preventDefault(); // Impede o menu de contexto padrão do navegador
                    const id = this.dataset.id;
                    let favoritos = JSON.parse(localStorage.getItem('htmlgames_favs')) || [];

                    if (favoritos.includes(id)) {
                        favoritos = favoritos.filter(favId => favId !== id);
                    } else {
                        favoritos.push(id);
                    }

                    localStorage.setItem('htmlgames_favs', JSON.stringify(favoritos));
                    carregarFavoritos();
                    filtrarJogos();
                });
            });
        }


        /* =====================================================
           PESQUISA E FILTROS COMBINADOS
        ===================================================== */

        const search = document.getElementById("search");
        const empty = document.getElementById("empty");

        function filtrarJogos() {
            const texto = search.value.toLowerCase().trim();
            let encontrados = 0;

            files.forEach(function (file) {
                const nome = file.dataset.name.toLowerCase();
                const ehFavorito = file.classList.contains('favorite');

                let passaNaAba = (abaAtual === 'todos') || (abaAtual === 'favoritos' && ehFavorito);
                let passaNaBusca = nome.includes(texto);

                if (passaNaAba && passaNaBusca) {
                    file.style.display = "flex";
                    encontrados++;
                } else {
                    file.style.display = "none";
                }
            });

            if (encontrados === 0) {
                empty.style.display = "block";
            } else {
                empty.style.display = "none";
            }
        }

        search.addEventListener("input", filtrarJogos);


        /* =====================================================
           ENTER NA PESQUISA
        ===================================================== */

        search.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                const visiveis = Array.from(files).filter(file => file.style.display !== "none");
                if (visiveis.length > 0) {
                    visiveis[0].click();
                }
            }
        });

        // Inicialização principal
        renderizarJogos();
        configurarEventosFavorito();

    </script>

</body>
</html>

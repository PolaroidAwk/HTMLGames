<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
        }

        /* =====================================================
           TOPO
        ===================================================== */

        .topbar {
            height: 64px;

            background: #161b22;
            border-bottom: 1px solid #30363d;

            display: flex;
            align-items: center;

            padding: 0 30px;
            gap: 15px;
        }

        .logo {
            width: 36px;
            height: 36px;

            background: #f0f6fc;
            color: #0d1117;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .title {
            font-size: 19px;
            font-weight: 600;
        }

        .subtitle {
            color: #8b949e;
            font-size: 13px;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {
            max-width: 1100px;

            margin: 40px auto;

            padding: 0 25px;
        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .repo-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 25px;
        }

        .repo-name {
            font-size: 24px;
            font-weight: 600;
        }

        .repo-name span {
            color: #58a6ff;
        }


        /* =====================================================
           PESQUISA
        ===================================================== */

        .search {
            width: 280px;

            background: #0d1117;

            border: 1px solid #30363d;

            border-radius: 6px;

            padding: 10px 13px;

            color: white;

            outline: none;

            font-size: 14px;
        }

        .search:focus {
            border-color: #58a6ff;
        }


        /* =====================================================
           BREADCRUMB
        ===================================================== */

        .breadcrumb {
            background: #161b22;

            border: 1px solid #30363d;

            padding: 13px 16px;

            border-radius: 6px 6px 0 0;

            color: #8b949e;

            font-size: 14px;
        }

        .breadcrumb strong {
            color: #e6edf3;
        }


        /* =====================================================
           LISTA DE JOGOS
        ===================================================== */

        .file-list {
            border: 1px solid #30363d;

            border-top: none;

            border-radius: 0 0 6px 6px;

            overflow: hidden;
        }


        /* =====================================================
           JOGO
        ===================================================== */

        .file {
            min-height: 70px;

            display: flex;

            align-items: center;

            padding: 0 18px;

            background: #0d1117;

            border-bottom: 1px solid #21262d;

            cursor: pointer;

            transition:
                background 0.15s,
                transform 0.1s;
        }

        .file:last-child {
            border-bottom: none;
        }

        .file:hover {
            background: #161b22;
        }

        .file:active {
            transform: scale(0.995);
        }


        /* =====================================================
           ÍCONE
        ===================================================== */

        .icon {
            width: 42px;

            font-size: 25px;

            margin-right: 14px;

            display: flex;

            justify-content: center;
        }


        /* =====================================================
           NOME
        ===================================================== */

        .filename {
            color: #58a6ff;

            font-size: 15px;

            font-weight: 500;

            flex: 1;
        }


        /* =====================================================
           DESCRIÇÃO
        ===================================================== */

        .description {
            color: #8b949e;

            font-size: 13px;

            margin-right: 20px;
        }


        /* =====================================================
           SETA
        ===================================================== */

        .arrow {
            color: #8b949e;

            font-size: 20px;

            transition: transform 0.15s;
        }

        .file:hover .arrow {
            transform: translateX(4px);

            color: #e6edf3;
        }


        /* =====================================================
           NENHUM RESULTADO
        ===================================================== */

        .empty {
            display: none;

            padding: 50px;

            text-align: center;

            color: #8b949e;

            border: 1px solid #30363d;

            border-top: none;
        }


        /* =====================================================
           RODAPÉ
        ===================================================== */

        .info {
            margin-top: 25px;

            color: #8b949e;

            font-size: 13px;

            text-align: center;
        }


        /* =====================================================
           CELULAR
        ===================================================== */

        @media (max-width: 700px) {

            .topbar {
                padding: 0 15px;
            }

            .container {
                margin-top: 25px;

                padding: 0 12px;
            }

            .repo-header {
                flex-direction: column;

                align-items: stretch;
            }

            .search {
                width: 100%;
            }

            .description {
                display: none;
            }

            .file {
                min-height: 65px;
            }
        }
    </style>
</head>


<body>


    <!-- =====================================================
         TOPO
    ===================================================== -->

    <header class="topbar">

        <div class="logo">
            🎮
        </div>

        <div>

            <div class="title">
                Game Hub
            </div>

            <div class="subtitle">
                Meus jogos HTML
            </div>

        </div>

    </header>


    <!-- =====================================================
         CONTEÚDO
    ===================================================== -->

    <main class="container">


        <!-- CABEÇALHO -->

        <div class="repo-header">

            <div class="repo-name">
                <span>games</span> / arquivos
            </div>

            <input
                id="search"
                class="search"
                type="text"
                placeholder="🔍 Procurar jogo..."
            >

        </div>


        <!-- CAMINHO -->

        <div class="breadcrumb">

            📁

            <strong>
                games
            </strong>

        </div>


        <!-- =================================================
             LISTA
        ================================================= -->

        <div
            class="file-list"
            id="fileList"
        >


            <!-- =================================================
                 FNAF
            ================================================= -->

            <div
                class="file"
                data-name="fnaf five nights at freddys"
                onclick="abrirJogo('FNAF/index.html')"
            >

                <div class="icon">
                    🐻
                </div>

                <div class="filename">
                    fnaf
                </div>

                <div class="description">
                    Five Nights at Freddy's
                </div>

                <div class="arrow">
                    →
                </div>

            </div>


            <!-- =================================================
                 AGAR.IO
            ================================================= -->

            <div
                class="file"
                data-name="agar agar io"
                onclick="abrirJogo('agar/index.html')"
            >

                <div class="icon">
                    🟢
                </div>

                <div class="filename">
                    agar
                </div>

                <div class="description">
                    Agar.io
                </div>

                <div class="arrow">
                    →
                </div>

            </div>


            <!-- =================================================
                 FLAPPY BIRD
            ================================================= -->

            <div
                class="file"
                data-name="flappy flappy bird"
                onclick="abrirJogo('flappy/index.html')"
            >

                <div class="icon">
                    🐦
                </div>

                <div class="filename">
                    flappy
                </div>

                <div class="description">
                    Flappy Bird
                </div>

                <div class="arrow">
                    →
                </div>

            </div>


            <!-- =================================================
                 TIGRINHO
            ================================================= -->

            <div
                class="file"
                data-name="tigrinho fortune tiger"
                onclick="abrirJogo('tigre/index.html')"
            >

                <div class="icon">
                    🎰
                </div>

                <div class="filename">
                    tigrinho
                </div>

                <div class="description">
                    Fortune Tiger
                </div>

                <div class="arrow">
                    →
                </div>

            </div>


            <!-- =================================================
                 ADICIONE MAIS JOGOS AQUI
            =================================================

            <div
                class="file"
                data-name="nome do jogo"
                onclick="abrirJogo('nome-da-pasta/index.html')"
            >

                <div class="icon">
                    🎮
                </div>

                <div class="filename">
                    nome-do-jogo
                </div>

                <div class="description">
                    Descrição do jogo
                </div>

                <div class="arrow">
                    →
                </div>

            </div>

            -->


        </div>


        <!-- =================================================
             VAZIO
        ================================================= -->

        <div
            class="empty"
            id="empty"
        >
            Nenhum jogo encontrado 😔
        </div>


        <div class="info">
            Clique em um jogo para começar.
        </div>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        /* =====================================================
           ABRIR JOGO
        ===================================================== */

        function abrirJogo(caminho) {

            window.location.href = "games/" + caminho;

        }


        /* =====================================================
           PESQUISA
        ===================================================== */

        const search =
            document.getElementById("search");

        const files =
            document.querySelectorAll(".file");

        const empty =
            document.getElementById("empty");


        search.addEventListener("input", function () {

            const texto =
                this.value
                    .toLowerCase()
                    .trim();

            let encontrados = 0;


            files.forEach(function (file) {

                const nome =
                    file.dataset.name.toLowerCase();


                if (nome.includes(texto)) {

                    file.style.display = "flex";

                    encontrados++;

                } else {

                    file.style.display = "none";

                }

            });


            if (encontrados === 0) {

                empty.style.display = "block";

            } else {

                empty.style.display = "none";

            }

        });

    </script>


</body>
</html>

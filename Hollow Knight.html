<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight@latest/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Hollow Knight</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #231F20; }
        #unity-container { width: 100%; height: 100%; position: fixed; top: 0; left: 0; }

        /* Botão de Save Manual */
        #cloud-save-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 10px 20px;
            background: #39ff88;
            color: #000;
            border: none;
            border-radius: 5px;
            font-family: sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        #cloud-save-btn:hover { background: #fff; transform: scale(1.05); }
        #cloud-save-btn:disabled { background: #666; cursor: not-allowed; }
    </style>
</head>

<body>
    <!-- Botão para forçar o salvamento na nuvem -->
    <button id="cloud-save-btn" onclick="forceCloudSave()">☁️ SALVAR NA NUVEM</button>

    <script>
        (function() {
            const SUPABASE_URL = "https://xsbbgoohvlgpprhqevyo.supabase.co";
            const SUPABASE_KEY = "sb_publishable_QsPz3adZO_MsaaQCdFrJNA_CzVu-ALy";
            const GAME_ID = "sys_v2_hollow_knight"; 
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const logStyle = "color: #39ff88; font-weight: bold; font-size: 14px; background: #000;";
            const errStyle = "color: #ff4a4a; font-weight: bold; font-size: 14px; background: #000;";
            const infoStyle = "color: #ffd84a; font-weight: bold; font-size: 14px; background: #000;";

            console.log("%c☁️ [SAVE-V2] Sistema de Monitoramento Iniciado...", logStyle);

            async function saveToCloud(data) {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        console.log("%c☁️ [SAVE-V2] Erro: Você precisa estar logado no Hub para salvar na nuvem.", errStyle);
                        return false;
                    }

                    const { error } = await supabase.from('game_saves').upsert({ 
                        user_id: session.user.id, 
                        game_id: GAME_ID, 
                        save_data: typeof data === 'object' ? JSON.stringify(data) : data, 
                        updated_at: new Date() 
                    }, { onConflict: 'user_id,game_id' });

                    if (error) throw error;
                    console.log("%c✅ [SAVE-V2] Sincronização com Supabase concluída!", logStyle);
                    return true;
                } catch (e) { 
                    console.error("%c❌ [SAVE-V2] Erro ao enviar:", errStyle, e.message); 
                    return false;
                }
            }

            async function loadFromCloud() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) return null;

                    const { data, error } = await supabase.from('game_saves')
                        .select('save_data')
                        .eq('user_id', session.user.id)
                        .eq('game_id', GAME_ID)
                        .maybeSingle(); 

                    if (error || !data) return null;
                    return data.save_data;
                } catch (e) { return null; }
            }

            // Função exposta globalmente para o botão
            window.forceCloudSave = async function() {
                const btn = document.getElementById('cloud-save-btn');
                btn.disabled = true;
                btn.textContent = "SALVANDO...";

                console.log("%c☁️ [SAVE-V2] Tentando coletar todos os saves disponíveis...", infoStyle);
                
                // Tenta coletar tudo do localStorage que pareça ser do jogo
                let collectedData = {};
                let foundAnything = false;

                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.toLowerCase().includes('save') || key.toLowerCase().includes('hollow') || key.toLowerCase().includes('data')) {
                        collectedData[key] = localStorage.getItem(key);
                        foundAnything = true;
                    }
                }

                if (foundAnything) {
                    const success = await saveToCloud(collectedData);
                    if (success) alert("✅ Save enviado para a nuvem!");
                    else alert("❌ Erro ao enviar. Veja o console (F12).");
                } else {
                    console.log("%c⚠️ [SAVE-V2] Nada encontrado no LocalStorage. O jogo pode estar usando IndexedDB puro.", infoStyle);
                    alert("⚠️ Nenhum save detectado no LocalStorage. O Unity pode estar usando IndexedDB (está fora do alcance do JS).");
                }

                btn.disabled = false;
                btn.textContent = "☁️ SALVAR NA NUVEM";
            };

            // Mantemos a interceptação por precaução
            const originalSetItem = localStorage.setItem;
            localStorage.setItem = function(key, value) {
                originalSetItem.apply(this, arguments);
                if (key.toLowerCase().includes('save') || key.toLowerCase().includes('hollow')) {
                    saveToCloud(value);
                }
            };

            window.addEventListener('load', async () => {
                const cloudData = await loadFromCloud();
                if (cloudData) {
                    console.log("%c✅ [SAVE-V2] Restaurando save da nuvem...", logStyle);
                    try {
                        const parsed = JSON.parse(cloudData);
                        for (const [key, value] of Object.entries(parsed)) {
                            localStorage.setItem(key, value);
                        }
                    } catch(e) {
                        localStorage.setItem('hollow_knight_save', cloudData);
                    }
                }
            });
        })();
    </script>

    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING... </div>
    <div hidden id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-mobile-warning"> WebGL builds are not supported on mobile devices. </div>
    </div>

    <script>
        /* LÓGICA ORIGINAL DO JOGO */
        var loadingText = document.querySelector("#loading-text");
        let totalBytes = 0;
        let loadedBytes = 0;
        async function getSize(url) {
            try {
                const res = await fetch(url, { method: "HEAD" });
                return parseInt(res.headers.get("Content-Length") || "0", 10);
            } catch { return 0; }
        }
        async function fetchWithProgress(url) {
            const response = await fetch(url);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                loadedBytes += value.length;
                chunks.push(value);
                let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
                let mbTotal = '860.36';
                loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
            }
            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }
        async function mergeFiles(fileParts) {
            const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
            const mergedBlob = new Blob(buffers);
            return URL.createObjectURL(mergedBlob);
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        (async () => {
            const allParts = [...getParts("Build/hk.data", 1, 42), ...getParts("Build/hk.wasm", 1, 2), ];
            const sizes = await Promise.all(allParts.map(getSize));
            totalBytes = sizes.reduce((a, b) => a + b, 0);
            const [dataUrl, wasmurl] = await Promise.all([
                mergeFiles(getParts("Build/hk.data", 1, 42)),
                mergeFiles(getParts("Build/hk.wasm", 1, 2)),
            ]);
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/hk.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/hk.framework.js",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Team Cherry & Truffled",
                productName: "Hollow Knight",
                productVersion: "1.0",
            };
            var container = document.querySelector("#unity-container");
            container.hidden = false;
            var canvas = document.querySelector("#unity-canvas");
            var loadingBar = document.querySelector("#unity-loading-bar");
            var progressBarFull = document.querySelector("#unity-progress-bar-full");
            var mobileWarning = document.querySelector("#unity-mobile-warning");
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                config.devicePixelRatio = 1;
                mobileWarning.style.display = "block";
                setTimeout(() => {
                    mobileWarning.style.display = "none";
                }, 5000);
            } else {
              if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                var meta = document.createElement('meta');
                meta.name = 'viewport';
                meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                document.getElementsByTagName('head')[0].appendChild(meta);
                container.className = "unity-mobile";
                canvas.className = "unity-mobile";
            } else {
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }
            }
            loadingBar.style.display = "block";
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                }).then((unityInstance) => {
                    loadingText.remove();
                    loadingBar.style.display = "none";
                    canvas.style.display = "block";
                }).catch((message) => {
                    alert(message);
                });
            };
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight@latest/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Hollow Knight</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- Importação do Supabase via URL Absoluta -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <!-- 
        SISTEMA DE SAVE EM NUVEM - COLOCADO NO TOPO PARA GARANTIR EXECUÇÃO 
    -->
    <script>
        (function() {
            console.log("🚀 [SISTEMA] Iniciando tentativa de carga do Save-V2...");

            // 1. Verificação de segurança do SDK
            if (typeof window.supabase === 'undefined') {
                console.error("❌ [SISTEMA] SDK do Supabase não foi carregado. Verifique a conexão!");
                return;
            }

            const SUPABASE_URL = "https://xsbbgoohvlgpprhqevyo.supabase.co";
            const SUPABASE_KEY = "sb_publishable_QsPz3adZO_MsaaQCdFrJNA_CzVu-ALy";
            const GAME_ID = "sys_v2_hollow_knight"; 
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const logStyle = "color: #39ff88; font-weight: bold; font-size: 14px; background: #000;";
            const errStyle = "color: #ff4a4a; font-weight: bold; font-size: 14px; background: #000;";
            const infoStyle = "color: #ffd84a; font-weight: bold; font-size: 14px; background: #000;";

            console.log("%c☁️ [SAVE-V2] SCRIPT CARREGADO COM SUCESSO!", logStyle);
            
            // ALERTA DE TESTE: Se isso aparecer, o sistema está funfando.
            // Remova a linha abaixo depois que confirmar que funciona.
            alert("✅ Sistema de Save Cloud Carregado!");

            async function saveToCloud(data) {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) {
                        console.log("%c☁️ [SAVE-V2] Usuário deslogado. Salvando localmente.", infoStyle);
                        return;
                    }

                    const { error } = await supabase.from('game_saves').upsert({ 
                        user_id: session.user.id, 
                        game_id: GAME_ID, 
                        save_data: typeof data === 'object' ? JSON.stringify(data) : data, 
                        updated_at: new Date() 
                    }, { onConflict: 'user_id,game_id' });

                    if (error) throw error;
                    console.log("%c✅ [SAVE-V2] Progresso enviado para a nuvem!", logStyle);
                } catch (e) { 
                    console.error("%c❌ [SAVE-V2] Erro ao salvar:", errStyle, e.message); 
                }
            }

            async function loadFromCloud() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session) return null;

                    const { data, error } = await supabase.from('game_saves')
                        .select('save_data')
                        .eq('user_id', session.user.id)
                        .eq('game_id', GAME_ID)
                        .single();

                    if (error || !data) return null;
                    console.log("%c✅ [SAVE-V2] Save de nuvem recuperado!", logStyle);
                    return data.save_data;
                } catch (e) { return null; }
            }

            // Interceptação do LocalStorage
            const originalSetItem = localStorage.setItem;
            localStorage.setItem = function(key, value) {
                originalSetItem.apply(this, arguments);
                if (key.toLowerCase().includes('save') || key.toLowerCase().includes('hollow') || key.toLowerCase().includes('data')) {
                    saveToCloud(value);
                }
            };

            const originalGetItem = localStorage.getItem;
            localStorage.getItem = async function(key) {
                if (key.toLowerCase().includes('save') || key.toLowerCase().includes('hollow') || key.toLowerCase().includes('data')) {
                    const cloudData = await loadFromCloud();
                    if (cloudData) {
                        console.log(`%c☁️ [SAVE-V2] Injetando cloud save na chave: ${key}`, logStyle);
                        originalSetItem(key, cloudData);
                        return cloudData;
                    }
                }
                return originalGetItem.apply(this, arguments);
            };

            window.addEventListener('load', async () => {
                console.log("%c☁️ [SAVE-V2] Verificando sincronização inicial...", infoStyle);
                const cloudData = await loadFromCloud();
                if (cloudData) {
                    localStorage.setItem('hollow_knight_save', cloudData);
                    localStorage.setItem('save_data', cloudData);
                    console.log("%c✅ [SAVE-V2] Sincronização inicial feita!", logStyle);
                }
            });
        })();
    </script>

    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING... </div>
    <div hidden id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-mobile-warning"> WebGL builds are not supported on mobile devices. </div>
    </div>

    <script>
        /* LÓGICA ORIGINAL DO JOGO */
        var loadingText = document.querySelector("#loading-text");
        let totalBytes = 0;
        let loadedBytes = 0;
        async function getSize(url) {
            try {
                const res = await fetch(url, { method: "HEAD" });
                return parseInt(res.headers.get("Content-Length") || "0", 10);
            } catch { return 0; }
        }
        async function fetchWithProgress(url) {
            const response = await fetch(url);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                loadedBytes += value.length;
                chunks.push(value);
                let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
                let mbTotal = '860.36';
                loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
            }
            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }
        async function mergeFiles(fileParts) {
            const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
            const mergedBlob = new Blob(buffers);
            return URL.createObjectURL(mergedBlob);
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        (async () => {
            const allParts = [...getParts("Build/hk.data", 1, 42), ...getParts("Build/hk.wasm", 1, 2), ];
            const sizes = await Promise.all(allParts.map(getSize));
            totalBytes = sizes.reduce((a, b) => a + b, 0);
            const [dataUrl, wasmurl] = await Promise.all([
                mergeFiles(getParts("Build/hk.data", 1, 42)),
                mergeFiles(getParts("Build/hk.wasm", 1, 2)),
            ]);
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/hk.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/hk.framework.js",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Team Cherry & Truffled",
                productName: "Hollow Knight",
                productVersion: "1.0",
            };
            var container = document.querySelector("#unity-container");
            container.hidden = false;
            var canvas = document.querySelector("#unity-canvas");
            var loadingBar = document.querySelector("#unity-loading-bar");
            var progressBarFull = document.querySelector("#unity-progress-bar-full");
            var mobileWarning = document.querySelector("#unity-mobile-warning");
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                config.devicePixelRatio = 1;
                mobileWarning.style.display = "block";
                setTimeout(() => {
                    mobileWarning.style.display = "none";
                }, 5000);
            } else {
              if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                var meta = document.createElement('meta');
                meta.name = 'viewport';
                meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                document.getElementsByTagName('head')[0].appendChild(meta);
                container.className = "unity-mobile";
                canvas.className = "unity-mobile";
            } else {
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }
            }
            loadingBar.style.display = "block";
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                }).then((unityInstance) => {
                    loadingText.remove();
                    loadingBar.style.display = "none";
                    canvas.style.display = "block";
                }).catch((message) => {
                    alert(message);
                });
            };
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>

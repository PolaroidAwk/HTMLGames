name: Bump site version

on:
  push:
    branches:
      - main
    paths-ignore:
      - "version.json"

permissions:
  contents: write

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump site version')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increase patch version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("version.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          parts = [int(part) for part in data["version"].split(".")]

          while len(parts) < 3:
              parts.append(0)

          parts[2] += 1
          data["version"] = ".".join(str(part) for part in parts)
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"Site version: v{data['version']}")
          PY

      - name: Commit updated version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump site version [skip ci]"
          git push origin main

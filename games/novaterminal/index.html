<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Terminal | Trading Pro</title>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --bg-card: #1f2937;
            --bg-input: #0b1120;
            --border: #374151;
            --border-focus: #4f46e5;
            
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;

            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.15);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.15);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Header */
        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 900;
        }

        .market-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-base);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
        }

        /* App Layout Container */
        .app-layout {
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        /* Top Bar - Modes & Stats */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .mode-selector {
            display: flex;
            background: var(--bg-surface);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .timer-badge {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            display: none;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .metric-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* Main Workspace */
        .workspace-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }

        @media (max-width: 900px) {
            .workspace-grid { grid-template-columns: 1fr; }
        }

        .panel-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Asset Header */
        .asset-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .asset-title h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-ticker {
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .price-container {
            text-align: right;
        }

        .current-price {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .price-change {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .up { color: var(--green); }
        .down { color: var(--red); }
        .bg-up { background: var(--green-glow); color: var(--green); }
        .bg-down { background: var(--red-glow); color: var(--red); }

        /* Chart Canvas */
        .chart-box {
            position: relative;
            width: 100%;
            height: 220px;
            background: var(--bg-base);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Order Form Controls */
        .trade-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-card);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .form-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-box {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
        }

        .input-box:focus { border-color: var(--accent); }

        .btn {
            border: none;
            border-radius: 6px;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-max { background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border); padding: 10px 12px; }
        .btn-buy { background: var(--green); color: #000; flex: 1; }
        .btn-sell { background: var(--red); color: #fff; flex: 1; }
        .btn-close { background: var(--gold); color: #000; width: 100%; }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        /* News & Order Book Tab */
        .feed-header {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .news-item {
            background: var(--bg-card);
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 0.85rem;
        }

        .news-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .news-title {
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-primary);
        }

        .news-desc {
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.3;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 13, 22, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.hidden { display: none; }

        .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .stats-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo">NV</div>
            <span>Nova Terminal</span>
        </div>
        <div class="market-status">
            <div class="status-dot"></div>
            <span>Mercado Ativo</span>
        </div>
    </header>

    <div class="app-layout">
        <!-- Top Bar Control -->
        <div class="top-bar">
            <div class="mode-selector">
                <button class="mode-btn active" onclick="game.setMode('standard')">Padrão</button>
                <button class="mode-btn" onclick="game.setMode('speed')">Day Trade</button>
                <button class="mode-btn" onclick="game.setMode('time')">Desafio 60s</button>
            </div>
            <div id="timer-badge" class="timer-badge">Tempo: 60s</div>
        </div>

        <!-- Metrics Dashboard -->
        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-label">Saldo Disponível</span>
                <span id="cash-display" class="metric-value">R$ 10.000</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Ações (NVT)</span>
                <span id="shares-display" class="metric-value">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Patrimônio Total</span>
                <span id="total-display" class="metric-value">R$ 10.000</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Resultado (P/L)</span>
                <span id="pl-display" class="metric-value up">R$ 0 (0%)</span>
            </div>
        </div>

        <!-- Workspace Grid -->
        <div class="workspace-grid">
            <!-- Left Chart & Order Panel -->
            <div class="panel-card">
                <div class="asset-header">
                    <div class="asset-title">
                        <h2>Nova Tech <span class="badge-ticker">NVT</span></h2>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">Setor: Tecnologia & IA</span>
                    </div>
                    <div class="price-container">
                        <div class="current-price" id="price-display">R$ 100</div>
                        <div class="price-change bg-up" id="pct-display">+0%</div>
                    </div>
                </div>

                <div class="chart-box">
                    <canvas id="chartCanvas"></canvas>
                </div>

                <div class="trade-form">
                    <div class="form-row">
                        <input type="number" id="trade-qty" class="input-box" value="10" min="1" placeholder="Qtd">
                        <button class="btn btn-max" onclick="game.setMax()">MÁX</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-buy" onclick="game.buy()">COMPRAR</button>
                        <button class="btn btn-sell" onclick="game.sell()">VENDER</button>
                    </div>
                    <button class="btn btn-close" onclick="game.stop('Sessão Encerrada', 'Você encerrou manualmente suas posições no mercado.')">ENCERRAR E REGISTRAR</button>
                </div>
            </div>

            <!-- Right Feed Panel -->
            <div class="panel-card">
                <div class="feed-header">Feed de Notícias & Eventos</div>
                <div class="news-list" id="news-container"></div>
            </div>
        </div>
    </div>

    <!-- Modal End Overlay -->
    <div id="end-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 id="end-title">Fim da Partida</h2>
            <p id="end-subtitle" style="font-size: 0.85rem; color: var(--text-secondary);">Resumo das operações</p>
            
            <div class="stats-box">
                <div class="stats-row">
                    <span style="color: var(--text-secondary);">Patrimônio Final</span>
                    <strong id="final-val" style="color: var(--green);">R$ 0</strong>
                </div>
                <div class="stats-row">
                    <span style="color: var(--text-secondary);">Maior Recorde</span>
                    <strong id="record-val" style="color: var(--gold);">R$ 0</strong>
                </div>
            </div>

            <button class="btn btn-buy" onclick="game.restart()">Iniciar Nova Sessão</button>
        </div>
    </div>

    <script>
        class TradingEngine {
            constructor() {
                this.initialCapital = 10000;
                this.canvas = document.getElementById('chartCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.mode = 'standard';
                this.timerSeconds = 60;
                
                this.newsPool = [
                    { t: "Aprovação de Novo Projeto", d: "A empresa aprovou expansão para novos mercados regionais." },
                    { t: "Relatório Financeiro", d: "Demonstrações financeiras recentes foram divulgadas pela diretoria." },
                    { t: "Oscilação do Setor", d: "Condições macroeconômicas impactam empresas de tecnologia." },
                    { t: "Análise de Analistas", d: "Mercado reavalia recomendações para o setor de tecnologia." },
                    { t: "Inovação Tecnológica", d: "Nova atualização no portfólio de produtos foi anunciada." }
                ];

                window.addEventListener('resize', () => this.resizeCanvas());
                this.restart();
            }

            setMode(mode) {
                this.mode = mode;
                document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                
                const badge = document.getElementById('timer-badge');
                if (mode === 'time') {
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }

                this.restart();
            }

            resizeCanvas() {
                if (!this.canvas.parentElement) return;
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
                this.drawChart();
            }

            restart() {
                document.getElementById('end-modal').classList.add('hidden');

                this.cash = this.initialCapital;
                this.shares = 0;
                this.price = 100;
                this.history = Array(40).fill(100);
                this.sentiment = 0;

                document.getElementById('news-container').innerHTML = '';

                if (this.marketTimer) clearInterval(this.marketTimer);
                if (this.newsTimer) clearInterval(this.newsTimer);
                if (this.countdownTimer) clearInterval(this.countdownTimer);

                let intervalSpeed = this.mode === 'speed' ? 600 : 1200;
                
                this.marketTimer = setInterval(() => this.tick(), intervalSpeed);
                this.newsTimer = setInterval(() => this.pushNews(), 6000);

                if (this.mode === 'time') {
                    this.timerSeconds = 60;
                    document.getElementById('timer-badge').innerText = `Tempo: ${this.timerSeconds}s`;
                    this.countdownTimer = setInterval(() => {
                        this.timerSeconds--;
                        document.getElementById('timer-badge').innerText = `Tempo: ${this.timerSeconds}s`;
                        if (this.timerSeconds <= 0) {
                            this.stop('Tempo Esgotado!', 'O limite de 60 segundos do desafio foi atingido.');
                        }
                    }, 1000);
                }

                this.pushNews("Terminal Conectado", "Sessão iniciada. Acompanhe a cotação e negocie.");
                setTimeout(() => this.resizeCanvas(), 50);
                this.updateUI();
            }

            tick() {
                let vol = this.mode === 'speed' ? 0.06 : 0.035;
                let noise = (Math.random() - 0.49) * vol;

                if (Math.random() < 0.03) noise -= 0.10;
                if (Math.random() < 0.03) noise += 0.10;

                let delta = noise + this.sentiment;
                this.sentiment *= 0.7;

                let nextPrice = Math.round(this.price * (1 + delta));
                this.price = Math.max(1, nextPrice);

                this.history.push(this.price);
                if (this.history.length > 40) this.history.shift();

                if (this.price <= 1 && this.shares > 0) {
                    this.stop("Falência Detetada!", "A cotação atingiu o limite mínimo.");
                    return;
                }

                this.updateUI();
            }

            pushNews(title, desc) {
                if (!title) {
                    let item = this.newsPool[Math.floor(Math.random() * this.newsPool.length)];
                    title = item.t;
                    desc = item.d;
                    this.sentiment += (Math.random() - 0.48) * 0.2;
                }

                const container = document.getElementById('news-container');
                const card = document.createElement('div');
                card.className = 'news-item';

                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

                card.innerHTML = `
                    <div class="news-meta">NVT • ${timeStr}</div>
                    <div class="news-title">${title}</div>
                    <div class="news-desc">${desc}</div>
                `;

                container.prepend(card);
            }

            buy() {
                const qty = parseInt(document.getElementById('trade-qty').value);
                if (isNaN(qty) || qty <= 0) return;

                const cost = qty * this.price;
                if (this.cash >= cost) {
                    this.cash -= cost;
                    this.shares += qty;
                    this.updateUI();
                } else {
                    alert("Saldo insuficiente para esta ordem.");
                }
            }

            sell() {
                const qty = parseInt(document.getElementById('trade-qty').value);
                if (isNaN(qty) || qty <= 0) return;

                if (this.shares >= qty) {
                    this.cash += qty * this.price;
                    this.shares -= qty;
                    this.updateUI();
                } else {
                    alert("Ações insuficientes em custódia.");
                }
            }

            setMax() {
                const max = Math.floor(this.cash / this.price);
                document.getElementById('trade-qty').value = Math.max(1, max);
            }

            stop(title, desc) {
                clearInterval(this.marketTimer);
                clearInterval(this.newsTimer);
                if (this.countdownTimer) clearInterval(this.countdownTimer);

                const total = this.cash + (this.shares * this.price);
                
                let recKey = `nvt_rec_${this.mode}`;
                let record = parseInt(localStorage.getItem(recKey) || '0');
                if (total > record) {
                    record = total;
                    localStorage.setItem(recKey, record.toString());
                }

                document.getElementById('end-title').innerText = title;
                document.getElementById('end-subtitle').innerText = desc;
                document.getElementById('final-val').innerText = `R$ ${total.toLocaleString('pt-BR')}`;
                document.getElementById('record-val').innerText = `R$ ${record.toLocaleString('pt-BR')}`;

                document.getElementById('end-modal').classList.remove('hidden');
            }

            updateUI() {
                const total = this.cash + (this.shares * this.price);
                const pl = total - this.initialCapital;
                const plPct = Math.round((pl / this.initialCapital) * 100);

                document.getElementById('cash-display').innerText = `R$ ${this.cash.toLocaleString('pt-BR')}`;
                document.getElementById('shares-display').innerText = this.shares;
                document.getElementById('total-display').innerText = `R$ ${total.toLocaleString('pt-BR')}`;

                const plElem = document.getElementById('pl-display');
                plElem.innerText = `R$ ${pl.toLocaleString('pt-BR')} (${plPct}%)`;
                plElem.className = `metric-value ${pl >= 0 ? 'up' : 'down'}`;

                document.getElementById('price-display').innerText = `R$ ${this.price}`;

                const prevPrice = this.history[this.history.length - 2] || this.price;
                const pct = Math.round(((this.price - prevPrice) / prevPrice) * 100);
                const pctElem = document.getElementById('pct-display');
                
                pctElem.innerText = `${pct >= 0 ? '+' : ''}${pct}%`;
                pctElem.className = `price-change ${pct >= 0 ? 'bg-up' : 'bg-down'}`;

                this.drawChart();
            }

            drawChart() {
                if (!this.ctx || !this.canvas.width) return;

                const w = this.canvas.width;
                const h = this.canvas.height;
                const ctx = this.ctx;

                ctx.clearRect(0, 0, w, h);

                const data = this.history;
                const min = Math.min(...data) * 0.98;
                const max = Math.max(...data) * 1.02;
                const range = max - min || 1;

                const stepX = w / (data.length - 1);
                const isUp = data[data.length - 1] >= data[0];
                const color = isUp ? '#10b981' : '#ef4444';

                ctx.beginPath();
                data.forEach((val, idx) => {
                    let x = idx * stepX;
                    let y = h - ((val - min) / range) * h;
                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });

                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.lineTo(w, h);
                ctx.lineTo(0, h);
                ctx.closePath();

                let grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, isUp ? 'rgba(16, 185, 129, 0.2)' : 'rgba(239, 68, 68, 0.2)');
                grad.addColorStop(1, 'rgba(11, 17, 32, 0)');
                ctx.fillStyle = grad;
                ctx.fill();
            }
        }

        let game;
        window.addEventListener('DOMContentLoaded', () => {
            game = new TradingEngine();
        });
    </script>
</body>
</html>

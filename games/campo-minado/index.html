<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campo Minado</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #e8edf3,
                    #cfd6df
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #1f2937;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .game-container {

            width: min(95vw, 850px);

            background: #f8fafc;

            border-radius: 16px;

            padding: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.18);

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 20px;

        }


        .title {

            font-size: 32px;

            font-weight: 800;

            color: #111827;

        }


        .subtitle {

            margin-top: 4px;

            color: #6b7280;

            font-size: 14px;

        }


        /* =====================================================
           CONTROLES
        ===================================================== */

        .controls {

            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

        }


        select,
        .reset-button {

            height: 40px;

            padding:
                0 13px;

            border-radius: 8px;

            border: 1px solid #d1d5db;

            background: white;

            color: #374151;

            font-size: 14px;

            cursor: pointer;

        }


        .reset-button {

            background: #2563eb;

            border-color: #2563eb;

            color: white;

            font-weight: 700;

        }


        .reset-button:hover {

            background: #1d4ed8;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            display: grid;

            grid-template-columns:
                1fr
                80px
                1fr;

            align-items: center;

            gap: 12px;

            margin-bottom: 16px;

        }


        .counter,
        .timer {

            background: #111827;

            color: #f9fafb;

            border-radius: 8px;

            padding: 10px 14px;

            font-family:
                "Courier New",
                monospace;

            font-size: 20px;

            font-weight: bold;

            text-align: center;

        }


        .face {

            width: 56px;

            height: 56px;

            border-radius: 10px;

            border: 1px solid #d1d5db;

            background: white;

            cursor: pointer;

            font-size: 27px;

            display: flex;

            align-items: center;

            justify-content: center;

            justify-self: center;

        }


        .face:hover {

            background: #f3f4f6;

        }


        /* =====================================================
           TABULEIRO
        ===================================================== */

        .board-wrapper {

            width: 100%;

            overflow: auto;

            background: #cbd5e1;

            border-radius: 10px;

            padding: 12px;

        }


        .board {

            display: grid;

            width: max-content;

            margin: auto;

            gap: 2px;

            background: #94a3b8;

            border: 3px solid #94a3b8;

        }


        /* =====================================================
           CÉLULA
        ===================================================== */

        .cell {

            width: 32px;

            height: 32px;

            border-radius: 4px;

            background: #e5e7eb;

            border: 2px solid #f9fafb;

            box-shadow:
                inset -1px -1px 0 #9ca3af;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 18px;

            font-weight: 900;

            cursor: pointer;

            user-select: none;

        }


        .cell:hover {

            background: #dbeafe;

        }


        .cell.revealed {

            background: #cbd5e1;

            border: 1px solid #94a3b8;

            box-shadow: none;

            cursor: default;

        }


        .cell.flagged {

            color: #dc2626;

            font-size: 20px;

        }


        .cell.mine {

            background: #ef4444;

            color: white;

        }


        .cell.exploded {

            background: #991b1b;

        }


        /* =====================================================
           CORES DOS NÚMEROS
        ===================================================== */

        .number-1 {
            color: #2563eb;
        }

        .number-2 {
            color: #16a34a;
        }

        .number-3 {
            color: #dc2626;
        }

        .number-4 {
            color: #7c3aed;
        }

        .number-5 {
            color: #b45309;
        }

        .number-6 {
            color: #0891b2;
        }

        .number-7 {
            color: #111827;
        }

        .number-8 {
            color: #6b7280;
        }


        /* =====================================================
           MENSAGEM
        ===================================================== */

        .message {

            text-align: center;

            min-height: 24px;

            margin-top: 15px;

            font-size: 15px;

            font-weight: 600;

            color: #6b7280;

        }


        /* =====================================================
           REGRAS
        ===================================================== */

        .rules {

            margin-top: 18px;

            padding-top: 15px;

            border-top: 1px solid #e5e7eb;

            display: flex;

            justify-content: center;

            gap: 25px;

            color: #6b7280;

            font-size: 13px;

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 650px) {

            .game-container {

                width: 100%;

                min-height: 100vh;

                border-radius: 0;

                padding: 15px;

            }


            .header {

                flex-direction: column;

                align-items: stretch;

            }


            .title {

                font-size: 27px;

            }


            .controls {

                justify-content: space-between;

            }


            .status {

                grid-template-columns:
                    1fr
                    60px
                    1fr;

            }


            .cell {

                width: 29px;

                height: 29px;

                font-size: 16px;

            }


            .rules {

                flex-direction: column;

                gap: 5px;

                text-align: center;

            }

        }

    </style>

</head>


<body>


<div class="game-container">


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <div class="header">

        <div>

            <div class="title">
                💣 Campo Minado
            </div>

            <div class="subtitle">
                Revele todas as casas sem encontrar uma mina.
            </div>

        </div>


        <div class="controls">

            <select id="difficulty">

                <option value="easy">
                    Fácil — 9×9 / 10 minas
                </option>

                <option value="medium" selected>
                    Médio — 16×16 / 40 minas
                </option>

                <option value="hard">
                    Difícil — 30×16 / 99 minas
                </option>

            </select>


            <button
                class="reset-button"
                id="resetButton"
            >
                Novo jogo
            </button>

        </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div class="status">

        <div
            class="counter"
            id="mineCounter"
        >
            040
        </div>


        <button
            class="face"
            id="face"
            title="Novo jogo"
        >
            🙂
        </button>


        <div
            class="timer"
            id="timer"
        >
            000
        </div>

    </div>


    <!-- =====================================================
         TABULEIRO
    ====================================================== -->

    <div class="board-wrapper">

        <div
            class="board"
            id="board"
        ></div>

    </div>


    <!-- =====================================================
         MENSAGEM
    ====================================================== -->

    <div
        class="message"
        id="message"
    >
        Clique em uma casa para começar.
    </div>


    <!-- =====================================================
         REGRAS
    ====================================================== -->

    <div class="rules">

        <span>
            🖱️ Clique esquerdo: revelar
        </span>

        <span>
            🚩 Clique direito: marcar
        </span>

        <span>
            🎯 Revele todas as casas seguras para vencer
        </span>

    </div>


</div>


<script>

/* ============================================================
   CONFIGURAÇÕES
============================================================ */

const difficulties = {

    easy: {
        rows: 9,
        cols: 9,
        mines: 10
    },

    medium: {
        rows: 16,
        cols: 16,
        mines: 40
    },

    hard: {
        rows: 16,
        cols: 30,
        mines: 99
    }

};


/* ============================================================
   VARIÁVEIS
============================================================ */

let currentDifficulty = "medium";

let rows = 16;
let cols = 16;
let mineCount = 40;

let board = [];

let gameStarted = false;
let gameOver = false;

let flags = 0;
let revealedCells = 0;

let timer = 0;
let timerInterval = null;


/* ============================================================
   ELEMENTOS
============================================================ */

const boardElement =
    document.getElementById("board");

const mineCounter =
    document.getElementById("mineCounter");

const timerElement =
    document.getElementById("timer");

const messageElement =
    document.getElementById("message");

const faceElement =
    document.getElementById("face");

const resetButton =
    document.getElementById("resetButton");

const difficultyElement =
    document.getElementById("difficulty");


/* ============================================================
   NOVO JOGO
============================================================ */

function newGame() {

    clearInterval(timerInterval);

    const config =
        difficulties[currentDifficulty];

    rows = config.rows;
    cols = config.cols;
    mineCount = config.mines;

    board = [];

    gameStarted = false;
    gameOver = false;

    flags = 0;
    revealedCells = 0;

    timer = 0;

    timerElement.textContent = "000";

    mineCounter.textContent =
        String(mineCount).padStart(3, "0");

    faceElement.textContent = "🙂";

    messageElement.textContent =
        "Clique em uma casa para começar.";


    /*
    ============================================================
    CRIAR MATRIZ
    ============================================================
    */

    for (let y = 0; y < rows; y++) {

        board[y] = [];

        for (let x = 0; x < cols; x++) {

            board[y][x] = {

                mine: false,

                revealed: false,

                flagged: false,

                number: 0

            };

        }

    }


    /*
    ============================================================
    DESENHAR
    ============================================================
    */

    boardElement.innerHTML = "";

    boardElement.style.gridTemplateColumns =
        `repeat(${cols}, 32px)`;


    for (let y = 0; y < rows; y++) {

        for (let x = 0; x < cols; x++) {

            const element =
                document.createElement("div");

            element.className = "cell";

            element.dataset.x = x;
            element.dataset.y = y;


            element.addEventListener(
                "click",
                function () {

                    reveal(x, y);

                }
            );


            element.addEventListener(
                "contextmenu",
                function (event) {

                    event.preventDefault();

                    toggleFlag(x, y);

                }
            );


            boardElement.appendChild(element);

        }

    }

}


/* ============================================================
   PRIMEIRO CLIQUE
============================================================ */

function startGame(firstX, firstY) {

    gameStarted = true;

    placeMines(firstX, firstY);

    calculateNumbers();

    startTimer();

    messageElement.textContent =
        "Jogo iniciado. Boa sorte!";

}


/* ============================================================
   COLOCAR MINAS
============================================================ */

function placeMines(safeX, safeY) {

    /*
        O primeiro clique e seus vizinhos
        ficam protegidos.

        Isso evita começar em uma situação
        injusta.
    */

    const forbidden = new Set();


    for (let dy = -1; dy <= 1; dy++) {

        for (let dx = -1; dx <= 1; dx++) {

            const x = safeX + dx;
            const y = safeY + dy;

            if (
                x >= 0 &&
                x < cols &&
                y >= 0 &&
                y < rows
            ) {

                forbidden.add(
                    `${x},${y}`
                );

            }

        }

    }


    let placed = 0;


    while (placed < mineCount) {

        const x =
            Math.floor(
                Math.random() * cols
            );

        const y =
            Math.floor(
                Math.random() * rows
            );


        const key =
            `${x},${y}`;


        if (forbidden.has(key))
            continue;


        if (board[y][x].mine)
            continue;


        board[y][x].mine = true;

        placed++;

    }

}


/* ============================================================
   CALCULAR NÚMEROS
============================================================ */

function calculateNumbers() {

    for (let y = 0; y < rows; y++) {

        for (let x = 0; x < cols; x++) {

            if (board[y][x].mine)
                continue;


            board[y][x].number =
                countAdjacentMines(x, y);

        }

    }

}


/* ============================================================
   CONTAR MINAS
============================================================ */

function countAdjacentMines(x, y) {

    let count = 0;


    for (let dy = -1; dy <= 1; dy++) {

        for (let dx = -1; dx <= 1; dx++) {

            if (
                dx === 0 &&
                dy === 0
            ) {
                continue;
            }


            const nx = x + dx;
            const ny = y + dy;


            if (
                nx >= 0 &&
                nx < cols &&
                ny >= 0 &&
                ny < rows
            ) {

                if (board[ny][nx].mine) {

                    count++;

                }

            }

        }

    }


    return count;

}


/* ============================================================
   REVELAR
============================================================ */

function reveal(x, y) {

    if (gameOver)
        return;


    const cell =
        board[y][x];


    if (
        cell.revealed ||
        cell.flagged
    ) {
        return;
    }


    /*
    ------------------------------------------------------------
    PRIMEIRO CLIQUE
    ------------------------------------------------------------
    */

    if (!gameStarted) {

        startGame(x, y);

    }


    /*
    ------------------------------------------------------------
    MINA
    ------------------------------------------------------------
    */

    if (cell.mine) {

        cell.revealed = true;

        const element =
            getElement(x, y);

        element.classList.add(
            "revealed",
            "mine",
            "exploded"
        );

        element.textContent = "💣";

        loseGame();

        return;

    }


    /*
    ------------------------------------------------------------
    CASA NORMAL
    ------------------------------------------------------------
    */

    floodReveal(x, y);


    /*
    ------------------------------------------------------------
    VERIFICAR VITÓRIA
    ------------------------------------------------------------
    */

    checkWin();

}


/* ============================================================
   FLOOD REVEAL
============================================================ */

function floodReveal(startX, startY) {

    const queue = [
        [startX, startY]
    ];

    const visited = new Set();


    while (queue.length > 0) {

        const [x, y] =
            queue.shift();


        const key =
            `${x},${y}`;


        if (visited.has(key))
            continue;


        visited.add(key);


        if (
            x < 0 ||
            x >= cols ||
            y < 0 ||
            y >= rows
        ) {
            continue;
        }


        const cell =
            board[y][x];


        if (
            cell.revealed ||
            cell.flagged ||
            cell.mine
        ) {
            continue;
        }


        cell.revealed = true;

        revealedCells++;


        const element =
            getElement(x, y);


        element.classList.add(
            "revealed"
        );


        /*
        --------------------------------------------------------
        MOSTRAR NÚMERO
        --------------------------------------------------------
        */

        if (cell.number > 0) {

            element.textContent =
                cell.number;

            element.classList.add(
                `number-${cell.number}`
            );

        }


        /*
        --------------------------------------------------------
        SE FOR ZERO, ABRIR VIZINHOS
        --------------------------------------------------------
        */

        if (cell.number === 0) {

            for (let dy = -1; dy <= 1; dy++) {

                for (let dx = -1; dx <= 1; dx++) {

                    if (
                        dx === 0 &&
                        dy === 0
                    ) {
                        continue;
                    }


                    const nx = x + dx;
                    const ny = y + dy;


                    if (
                        nx >= 0 &&
                        nx < cols &&
                        ny >= 0 &&
                        ny < rows
                    ) {

                        queue.push([
                            nx,
                            ny
                        ]);

                    }

                }

            }

        }

    }

}


/* ============================================================
   BANDEIRA
============================================================ */

function toggleFlag(x, y) {

    if (gameOver)
        return;


    const cell =
        board[y][x];


    if (cell.revealed)
        return;


    /*
    ------------------------------------------------------------
    PRIMEIRA BANDEIRA NÃO COMEÇA O TIMER
    ------------------------------------------------------------
    */

    if (!cell.flagged) {

        if (flags >= mineCount)
            return;


        cell.flagged = true;

        flags++;

    } else {

        cell.flagged = false;

        flags--;

    }


    const element =
        getElement(x, y);


    element.textContent =
        cell.flagged ? "🚩" : "";


    element.classList.toggle(
        "flagged",
        cell.flagged
    );


    mineCounter.textContent =
        String(mineCount - flags)
            .padStart(3, "0");

}


/* ============================================================
   PEGAR ELEMENTO
============================================================ */

function getElement(x, y) {

    return boardElement.children[
        y * cols + x
    ];

}


/* ============================================================
   PERDEU
============================================================ */

function loseGame() {

    gameOver = true;

    clearInterval(timerInterval);

    faceElement.textContent = "😵";

    messageElement.textContent =
        "💥 Você perdeu!";


    /*
    ------------------------------------------------------------
    MOSTRAR TODAS AS MINAS
    ------------------------------------------------------------
    */

    for (let y = 0; y < rows; y++) {

        for (let x = 0; x < cols; x++) {

            const cell =
                board[y][x];


            if (cell.mine) {

                const element =
                    getElement(x, y);


                element.classList.add(
                    "revealed",
                    "mine"
                );


                if (!element.classList.contains(
                    "exploded"
                )) {

                    element.textContent = "💣";

                }

            }

        }

    }

}


/* ============================================================
   VERIFICAR VITÓRIA
============================================================ */

function checkWin() {

    const safeCells =
        rows * cols - mineCount;


    if (revealedCells !== safeCells)
        return;


    gameOver = true;

    clearInterval(timerInterval);

    faceElement.textContent = "😎";

    messageElement.textContent =
        "🎉 Você venceu! Campo limpo!";


    /*
    ------------------------------------------------------------
    MARCAR AUTOMATICAMENTE AS MINAS
    ------------------------------------------------------------
    */

    for (let y = 0; y < rows; y++) {

        for (let x = 0; x < cols; x++) {

            const cell =
                board[y][x];


            if (cell.mine) {

                cell.flagged = true;

                const element =
                    getElement(x, y);


                element.textContent = "🚩";

                element.classList.add(
                    "flagged"
                );

            }

        }

    }


    flags = mineCount;


    mineCounter.textContent =
        "000";

}


/* ============================================================
   TIMER
============================================================ */

function startTimer() {

    clearInterval(timerInterval);


    timerInterval =
        setInterval(function () {

            timer++;


            if (timer > 999) {

                timer = 999;

            }


            timerElement.textContent =
                String(timer)
                    .padStart(3, "0");


        }, 1000);

}


/* ============================================================
   REINICIAR
============================================================ */

function resetGame() {

    newGame();

}


/* ============================================================
   EVENTOS
============================================================ */

resetButton.addEventListener(
    "click",
    resetGame
);


faceElement.addEventListener(
    "click",
    resetGame
);


difficultyElement.addEventListener(
    "change",
    function () {

        currentDifficulty =
            this.value;

        newGame();

    }
);


/* ============================================================
   INICIAR
============================================================ */

newGame();

</script>

</body>

</html>

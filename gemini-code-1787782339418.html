<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tigrinho VIP Supreme 🐯 Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gold-primary: #ffd700;
      --gold-light: #fff3a1;
      --gold-dark: #b8860b;
      --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f5af19 50%, #e65c00 100%);
      --neon-red: #ff0055;
      --bg-dark: #0a030d;
      --card-bg: rgba(22, 10, 31, 0.75);
      --border-glow: 0 0 25px rgba(255, 215, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(245, 175, 25, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 10% 90%, rgba(138, 43, 226, 0.15) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    /* Container Principal */
    .slot-machine {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 215, 0, 0.4);
      border-radius: 32px;
      padding: 30px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), var(--border-glow);
      position: relative;
      overflow: hidden;
    }

    /* Detalhe estético de luz no topo */
    .slot-machine::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Título VIP */
    .header {
      margin-bottom: 20px;
    }

    .title-badge {
      display: inline-block;
      background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
      color: var(--gold-primary);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 4px 15px;
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(245, 175, 25, 0.5);
      letter-spacing: 1px;
    }

    /* Painel de Saldo e Ganhos */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .dash-card {
      background: rgba(10, 3, 13, 0.6);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 16px;
      padding: 12px;
      position: relative;
    }

    .dash-card span {
      display: block;
      font-size: 0.75rem;
      color: #a090b5;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .dash-card strong {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      color: #fff;
    }

    .dash-card.balance strong {
      color: var(--gold-primary);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .dash-card.win strong {
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    /* Roletas (Reels) */
    .reels-frame {
      background: linear-gradient(180deg, #050108 0%, #150520 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 215, 0, 0.2);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      position: relative;
    }

    /* Linha de Pagamento Neon central */
    .reels-frame::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-red), transparent);
      box-shadow: 0 0 8px var(--neon-red);
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 0.7;
    }

    .reel {
      flex: 1;
      height: 100px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3.2rem;
      user-select: none;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .spin-anim {
      animation: slotSpin 0.12s infinite linear;
      filter: blur(1px);
    }

    @keyframes slotSpin {
      0% { transform: translateY(-8px) scale(0.95); opacity: 0.8; }
      50% { transform: translateY(8px) scale(1.05); opacity: 0.5; }
      100% { transform: translateY(-8px) scale(0.95); opacity: 0.8; }
    }

    /* Controles de Aposta */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .bet-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 3, 13, 0.6);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 16px;
      padding: 6px 12px;
    }

    .bet-label {
      font-size: 0.85rem;
      color: #a090b5;
      font-weight: 600;
    }

    .bet-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bet-input-wrapper input {
      width: 90px;
      background: transparent;
      border: none;
      color: var(--gold-primary);
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    .btn-step {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: var(--gold-primary);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-step:hover {
      background: var(--gold-primary);
      color: #000;
    }

    .quick-bets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .btn-quick {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.15);
      color: #d1c4e9;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-quick:hover {
      background: rgba(255, 215, 0, 0.2);
      border-color: var(--gold-primary);
      color: #fff;
    }

    /* Botão Principal de Girar (3D Casino Style) */
    .btn-spin {
      width: 100%;
      background: var(--gold-gradient);
      border: none;
      border-radius: 20px;
      padding: 16px;
      color: #1a0000;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 0 #993d00, 0 15px 25px rgba(230, 92, 0, 0.4);
      transition: all 0.1s ease;
      position: relative;
      top: 0;
      text-transform: uppercase;
    }

    .btn-spin:hover {
      filter: brightness(1.15);
      box-shadow: 0 8px 0 #993d00, 0 20px 30px rgba(245, 175, 25, 0.6);
    }

    .btn-spin:active {
      top: 6px;
      box-shadow: 0 2px 0 #993d00, 0 5px 10px rgba(0, 0, 0, 0.4);
    }

    .btn-spin:disabled {
      background: linear-gradient(135deg, #444, #222);
      color: #777;
      box-shadow: 0 4px 0 #111;
      cursor: not-allowed;
      top: 4px;
    }

    /* Painel de Configuração Inicial / Reset */
    .config-panel {
      margin-top: 15px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .config-panel label {
      font-size: 0.75rem;
      color: #88789c;
    }

    .config-panel input {
      width: 80px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 6px;
      color: #fff;
      padding: 4px;
      text-align: center;
      font-size: 0.8rem;
    }

    .btn-set {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-set:hover {
      background: var(--gold-primary);
      color: #000;
    }

    /* Mensagem de Feedback */
    .message-box {
      min-height: 24px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 10px;
      color: #a090b5;
      transition: all 0.3s ease;
    }

    /* Animação do Jackpot */
    .jackpot-glow {
      animation: pulseGlow 0.5s infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
      to { box-shadow: 0 0 40px rgba(0, 255, 136, 0.9); }
    }
  </style>
</head>
<body>

  <div class="slot-machine" id="machine">
    <div class="header">
      <div class="title-badge">CASINO VIP EDITION</div>
      <h1>TIGRINHO 🐯</h1>
    </div>

    <!-- Dashboard -->
    <div class="dashboard">
      <div class="dash-card balance">
        <span>Saldo</span>
        <strong id="balance">1.000</strong>
      </div>
      <div class="dash-card win">
        <span>Último Ganho</span>
        <strong id="last-win">0</strong>
      </div>
    </div>

    <!-- Roletas -->
    <div class="reels-frame">
      <div class="reel" id="reel1">🐯</div>
      <div class="reel" id="reel2">🐯</div>
      <div class="reel" id="reel3">🐯</div>
    </div>

    <!-- Controles -->
    <div class="controls-panel">
      <div class="bet-selector">
        <span class="bet-label">VALOR DA APOSTA</span>
        <div class="bet-input-wrapper">
          <button class="btn-step" onclick="changeBet(-10)">-</button>
          <input type="number" id="bet-input" value="50" min="1" onchange="updateBetFromInput()" />
          <button class="btn-step" onclick="changeBet(10)">+</button>
        </div>
      </div>

      <div class="quick-bets">
        <button class="btn-quick" onclick="setBet(10)">10</button>
        <button class="btn-quick" onclick="setBet(50)">50</button>
        <button class="btn-quick" onclick="setBet(100)">100</button>
        <button class="btn-quick" onclick="setBet(500)">500</button>
        <button class="btn-quick" onclick="setBetMax()">MAX</button>
      </div>

      <button class="btn-spin" id="spin-btn" onclick="spin()">GIRAR ⚡</button>
    </div>

    <!-- Feedback Mensagem -->
    <div class="message-box" id="message">Faça sua aposta e boa sorte!</div>

    <!-- Definir Saldo -->
    <div class="config-panel">
      <label for="initial-balance-input">Definir Saldo:</label>
      <input type="number" id="initial-balance-input" value="1000" min="1" />
      <button class="btn-set" onclick="setInitialBalance()">Recarregar</button>
    </div>
  </div>

  <script>
    const symbols = ['🐯', '🍊', '🪙', '💎', '🔔', '7️⃣'];
    
    const multipliers = {
      '🐯': 10,
      '💎': 5,
      '7️⃣': 4,
      '🔔': 3,
      '🪙': 2,
      '🍊': 1.5
    };

    let balance = 1000;
    let bet = 50;
    let isSpinning = false;

    // Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, duration, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function setInitialBalance() {
      if (isSpinning) return;
      const val = parseInt(document.getElementById('initial-balance-input').value);
      if (!isNaN(val) && val > 0) {
        balance = val;
        if (bet > balance) bet = balance;
        updateUI();
        setMessage(`Saldo atualizado para $${balance.toLocaleString()}! 💰`, '#00ff88');
      }
    }

    function changeBet(amount) {
      if (isSpinning) return;
      setBet(bet + amount);
    }

    function setBet(amount) {
      if (isSpinning) return;
      bet = Math.max(1, amount);
      updateUI();
    }

    function updateBetFromInput() {
      if (isSpinning) return;
      let val = parseInt(document.getElementById('bet-input').value);
      if (isNaN(val) || val < 1) val = 1;
      bet = val;
      updateUI();
    }

    function setBetMax() {
      if (isSpinning) return;
      bet = balance > 0 ? balance : 1;
      updateUI();
    }

    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function setMessage(text, color = '#a090b5') {
      const msg = document.getElementById('message');
      msg.innerText = text;
      msg.style.color = color;
    }

    function spin() {
      if (isSpinning) return;
      if (balance <= 0) {
        setMessage('Sem saldo! Recarregue suas moedas abaixo. ❌', '#ff4466');
        return;
      }
      if (bet > balance) {
        setMessage('Aposta maior do que o saldo disponível! ⚠️', '#ffbb00');
        return;
      }

      isSpinning = true;
      balance -= bet;
      document.getElementById('machine').classList.remove('jackpot-glow');
      updateUI();

      const spinBtn = document.getElementById('spin-btn');
      spinBtn.disabled = true;

      const reel1 = document.getElementById('reel1');
      const reel2 = document.getElementById('reel2');
      const reel3 = document.getElementById('reel3');

      reel1.classList.add('spin-anim');
      reel2.classList.add('spin-anim');
      reel3.classList.add('spin-anim');

      setMessage('Soltando a fera... 🐯✨', '#ffd700');

      let soundInterval = setInterval(() => playSound(250, 0.05, 'triangle'), 90);

      setTimeout(() => {
        reel1.classList.remove('spin-anim');
        reel1.innerText = getRandomSymbol();
        playSound(350, 0.08, 'square');
      }, 700);

      setTimeout(() => {
        reel2.classList.remove('spin-anim');
        reel2.innerText = getRandomSymbol();
        playSound(450, 0.08, 'square');
      }, 1300);

      setTimeout(() => {
        clearInterval(soundInterval);
        reel3.classList.remove('spin-anim');
        reel3.innerText = getRandomSymbol();
        playSound(550, 0.12, 'square');

        checkWin(reel1.innerText, reel2.innerText, reel3.innerText);
        isSpinning = false;
        spinBtn.disabled = false;
      }, 1800);
    }

    function checkWin(s1, s2, s3) {
      let winAmount = 0;

      if (s1 === s2 && s2 === s3) {
        // TRIPLO
        const mult = multipliers[s1] || 2;
        winAmount = bet * mult * 3;
        balance += winAmount;
        
        setMessage(`BIG WIN! TRIPLO ${s1}! +$${winAmount.toLocaleString()} 🏆`, '#00ff88');
        document.getElementById('machine').classList.add('jackpot-glow');
        playWinSound(true);

      } else if (s1 === s2 || s2 === s3 || s1 === s3) {
        // DUPLA
        const matchSymbol = (s1 === s2) ? s1 : s3;
        const mult = multipliers[matchSymbol] || 1;
        winAmount = Math.floor(bet * mult);
        balance += winAmount;

        setMessage(`DUPLA DE ${matchSymbol}! +$${winAmount.toLocaleString()} ✨`, '#ffd700');
        playWinSound(false);

      } else {
        setMessage('Não foi dessa vez! Tente novamente. 🐾', '#a090b5');
      }

      document.getElementById('last-win').innerText = winAmount > 0 ? `+${winAmount.toLocaleString()}` : '0';
      updateUI();
    }

    function playWinSound(isJackpot) {
      const notes = isJackpot ? [523, 659, 783, 1046, 1318] : [440, 554, 659];
      notes.forEach((freq, idx) => {
        setTimeout(() => playSound(freq, 0.25, 'triangle'), idx * 100);
      });
    }

    function updateUI() {
      document.getElementById('balance').innerText = balance.toLocaleString();
      document.getElementById('bet-input').value = bet;
    }
  </script>
</body>
</html>
